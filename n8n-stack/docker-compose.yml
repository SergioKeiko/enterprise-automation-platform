services:
  traefik:
    # v3.7+ required: older Traefik versions pin Docker API 1.24, which
    # modern Docker engines (29+) reject
    image: traefik:v3.7
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      # Traefik dashboard — reachable only from the server itself (via SSH tunnel)
      - "127.0.0.1:8080:8080"
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/acme.json:/letsencrypt/acme.json"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      # Scoped Cloudflare API token (Zone -> DNS -> Edit) for Let's Encrypt DNS-01
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    networks:
      - default
      - proxy

  n8n:
    image: n8nio/n8n:2.31.7
    container_name: n8n
    restart: always
    environment:
      - N8N_HOST=n8n.${BASE_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${BASE_DOMAIN}
      - N8N_EDITOR_BASE_URL=https://n8n.${BASE_DOMAIN}
      - N8N_TRUST_PROXY=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      # Auto-prune execution history: keep max 14 days / 5000 executions
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${BASE_DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=cloudflare"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=proxy"
    volumes:
      # SQLite database, encryption key (config.json) and local files live here.
      # data/config.json is the n8n encryption key — losing it makes credential
      # backups unreadable. It is covered by scripts/enterprise-backup.sh.
      - ./data:/home/node/.n8n
    networks:
      - default
      - proxy

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant
    restart: always
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.${BASE_DOMAIN}`)"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.tls=true"
      - "traefik.http.routers.qdrant.tls.certresolver=cloudflare"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    volumes:
      - ./uptime-kuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.${BASE_DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls=true"
      - "traefik.http.routers.uptime.tls.certresolver=cloudflare"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
